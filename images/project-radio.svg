<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Oval radio telescope dish with a feed held at its focus by support struts">
  <rect width="160" height="160" rx="22" fill="#142b3b"/>
  <!-- Rear mount and tripod sit behind the oval reflector. -->
  <path d="M80 73 80 112m0 0-28 27m28-27 28 27M46 141h68" fill="none" stroke="#f1f4e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tilt the oval reflector and its feed together so the feed stays on-axis. -->
  <g transform="rotate(15 80 73)">
    <ellipse cx="80" cy="73" rx="52" ry="29" fill="#244352" stroke="#7bc8d1" stroke-width="4"/>
    <ellipse cx="80" cy="73" rx="39" ry="20" fill="none" stroke="#386173" stroke-width="3"/>
    <!-- Paired white rods hold the receiver on the dish's center axis. -->
    <path d="M42 53 75 43m43 10L85 43M80 102 80 44" fill="none" stroke="#f1f4e8" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="75" y="25" width="10" height="19" rx="4" fill="#ed967f"/>
  </g>
</svg>
