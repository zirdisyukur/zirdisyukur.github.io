<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantum Mechanics Exercises | Shankar</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 18rem;
        background: #eef1f3;
        color: #24323a;
      }
      .viewer-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: .45rem;
        padding: .55rem;
        border-bottom: 1px solid #cbd3d7;
        background: #fff;
      }
      .chapter-list {
        display: flex;
        flex: 1 1 16rem;
        flex-wrap: wrap;
        gap: .35rem;
      }
      button, .open-chapter {
        min-height: 2.25rem;
        padding: .45rem .7rem;
        border: 1px solid #b8c4ca;
        border-radius: .3rem;
        background: #fff;
        color: #344953;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: #a94b5f;
        background: #a94b5f;
        color: #fff;
      }
      button:focus-visible, .open-chapter:focus-visible {
        outline: 3px solid #d2a4af;
        outline-offset: 2px;
      }
      .chapter-arrows { display: flex; gap: .35rem; }
      .chapter-frame {
        width: 100%;
        height: 100%;
        min-height: 0;
        border: 0;
        background: #fff;
      }
      @media (max-width: 520px) {
        .viewer-toolbar { align-items: stretch; }
        .chapter-list { flex-basis: 100%; }
        .chapter-arrows { flex: 1; }
        .chapter-arrows button, .open-chapter { flex: 1; }
      }
    </style>
  </head>
  <body>
    <nav class="viewer-toolbar" aria-label="Exercise chapter navigation">
      <div class="chapter-list" role="group" aria-label="Choose a chapter">
        <button type="button" data-chapter="0" aria-pressed="true">Chapter 5</button>
        <button type="button" data-chapter="1" aria-pressed="false">Chapter 7</button>
        <button type="button" data-chapter="2" aria-pressed="false">Chapter 10</button>
        <button type="button" data-chapter="3" aria-pressed="false">Chapter 12</button>
      </div>
      <div class="chapter-arrows">
        <button type="button" id="previous-chapter" aria-label="Previous chapter">&lt; Previous</button>
        <button type="button" id="next-chapter" aria-label="Next chapter">Next &gt;</button>
      </div>
      <a class="open-chapter" id="open-chapter" href="chapter-05.pdf" target="_blank" rel="noopener">Open PDF</a>
    </nav>
    <iframe class="chapter-frame" id="chapter-frame" src="chapter-05.pdf#toolbar=1&navpanes=1&view=FitH" title="Chapter 5 exercises PDF"></iframe>
    <script>
      (function () {
        var chapters = [
          { number: 5, file: "chapter-05.pdf" },
          { number: 7, file: "chapter-07.pdf" },
          { number: 10, file: "chapter-10.pdf" },
          { number: 12, file: "chapter-12.pdf" }
        ];
        var current = 0;
        var frame = document.getElementById("chapter-frame");
        var openLink = document.getElementById("open-chapter");
        var chapterButtons = Array.prototype.slice.call(document.querySelectorAll("[data-chapter]"));

        function showChapter(index) {
          current = (index + chapters.length) % chapters.length;
          var chapter = chapters[current];
          frame.src = chapter.file + "#toolbar=1&navpanes=1&view=FitH";
          frame.title = "Chapter " + chapter.number + " exercises PDF";
          openLink.href = chapter.file;
          chapterButtons.forEach(function (button, buttonIndex) {
            button.setAttribute("aria-pressed", buttonIndex === current ? "true" : "false");
          });
        }

        chapterButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            showChapter(Number(button.getAttribute("data-chapter")));
          });
        });
        document.getElementById("previous-chapter").addEventListener("click", function () {
          showChapter(current - 1);
        });
        document.getElementById("next-chapter").addEventListener("click", function () {
          showChapter(current + 1);
        });
      }());
    </script>
  </body>
</html>
